bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /diff_drive_controller/odom

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # FIX: SimpleProgressChecker only measures linear displacement.
    # A diff-drive robot correctly rotating in place at a tight
    # corner barely translates, so the old 0.3m/8s limits aborted
    # valid in-place turns as "stuck". Loosened both.
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 15.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 1.0

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      min_vel_x: -0.35
      min_vel_y: 0.0
      max_vel_x: 0.35
      max_vel_y: 0.0
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.35
      min_speed_theta: 0.0
      # FIX: acc_lim_theta was 2.5 vs acc_lim_x 0.10 — a 25x
      # asymmetry that let the robot snap to full turn speed in
      # ~0.2s ("sometimes goes very fast"). Rebalanced as a pair.
      acc_lim_x: 0.20
      acc_lim_y: 0.0
      acc_lim_theta: 0.8
      decel_lim_x: -0.35
      decel_lim_y: 0.0
      decel_lim_theta: -0.8
      vx_samples: 15
      vy_samples: 1
      vtheta_samples: 60
      sim_time: 2.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      trans_stopped_velocity: 0.05
      xy_goal_tolerance: 0.12
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 2.0
      PathAlign.scale: 24.0
      GoalAlign.scale: 18.0
      PathDist.scale: 24.0
      GoalDist.scale: 18.0
      RotateToGoal.scale: 18.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 10.0
      publish_frequency: 5.0
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.17
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        # FIX: was 0.1 — smaller than robot's inscribed radius
        # (0.157m per your own launch-log error), which let the
        # global/local planner snap paths right up against walls
        # and zigzag along grid-cell edges. 0.2 clears the
        # inscribed radius with margin without closing off your
        # maze's ~0.3-0.35m corridors.
        inflation_radius: 0.20

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 3.0
      publish_frequency: 2.0
      resolution: 0.05
      robot_radius: 0.17
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        # Same fix as local_costmap above — matched value.
        inflation_radius: 0.20

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      # FIX: switched from NavfnPlanner to SmacPlanner2D — produces
      # meaningfully smoother paths in maze-like tight corridors
      # (motion-primitive search vs raw grid Dijkstra/A*), which
      # was the source of the jagged /plan causing DWB to fight
      # sharp heading corrections constantly.
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.15
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    behavior_plugins: ["spin", "backup", "wait", "drive_on_heading"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    # FIX: theta max_velocity was 1.5 — above DWB's own
    # max_vel_theta (0.5), so it was unreachable/meaningless.
    # Set to match DWB's real ceiling.
    max_velocity: [0.35, 0.0, 0.8]
    min_velocity: [-0.20, 0.0, -0.8]
    # FIX: max_accel theta was 2.5 — IDENTICAL to DWB's own
    # acc_lim_theta, making this smoother a no-op for angular
    # jumps. Now tighter than DWB's limits above, so it actually
    # smooths the handoff to /cmd_vel.
    max_accel: [0.20, 0.0, 0.6]
    max_decel: [-0.35, 0.0, -0.8]

collision_monitor:
  ros__parameters:
    use_sim_time: true
    # Safety layer: Nav2 costmaps are still the main planner protection.
    # This monitor adds an independent laser-based stop zone.
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: /scan
      enabled: true
      min_range: 0.05
      max_range: 2.0
      obstacle_min_range: 0.05
      obstacle_max_range: 2.0
    polygons: ["StopZone"]
    StopZone:
      type: "circle"
      radius: 0.28
      action_type: "stop"
      min_points: 4
      visualize: true
      polygon_pub_topic: /collision_monitor/stop_zone
    base_frame_id: base_link
    cmd_vel_in_topic: /diff_drive_controller/cmd_vel_unstamped
    cmd_vel_out_topic: /diff_drive_controller/cmd_vel_unstamped